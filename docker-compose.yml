# Local ROS 2 development services.
#
# Headless simulation:
#   docker compose up jazzy
#
# ROS 2 workspace checks:
#   docker compose --profile ci run --rm ci

services:
  jazzy:
    build:
      context: .
      args:
        ROS_DISTRO: jazzy
    environment:
      - TURTLEBOT3_MODEL=burger
    network_mode: host
    stdin_open: true
    tty: true
    command: >-
      ros2 launch hybrid_nav turtlebot3_adaptive_safety_filter.launch.py
      use_rviz:=false use_gz_gui:=false

  humble:
    build:
      context: .
      args:
        ROS_DISTRO: humble
    environment:
      - TURTLEBOT3_MODEL=burger
    network_mode: host
    stdin_open: true
    tty: true
    profiles:
      - humble
    command: >
      ros2 launch hybrid_nav turtlebot3_hybrid.launch.py use_rviz:=false use_gz_gui:=false

  ci:
    build:
      context: .
      args:
        ROS_DISTRO: jazzy
    environment:
      - TURTLEBOT3_MODEL=burger
      - ROS_LOCALHOST_ONLY=1
      - ROS_DOMAIN_ID=42
    profiles:
      - ci
    command: >-
      bash -lc
      "source /opt/ros/jazzy/setup.bash &&
      source /ros2_ws/install/setup.bash &&
      /opt/venv/bin/colcon test --event-handlers console_direct+ &&
      /opt/venv/bin/colcon test-result --verbose"
