# =============================================================================
# Risk-triggered adaptive MPC safety filter — Centralized Parameters
#
# The older smooth-blend Hybrid LQR-MPC controller is retained as a baseline.
# Use adaptive_safety_filter_node for the current publication-oriented method.
# =============================================================================
# Load via launch file:
#   Node(..., parameters=[params_yaml_path])
#
# All values tuned for TurtleBot3 Burger on GZ Sim (Harmonic/Garden).

# ── LQR Controller ──────────────────────────────────────────────────────────
lqr_controller_node:
  ros__parameters:
    use_sim_time: true
    control_rate: 20.0
    trajectory_amplitude: 0.5    # meters
    trajectory_frequency: 0.2    # rad/s
    trajectory_duration: 120.0   # seconds (2 min for slower trajectory)
    dt: 0.05
    v_max: 0.22                  # TurtleBot3 Burger max linear vel
    omega_max: 2.84              # TurtleBot3 Burger max angular vel
    q_x: 5.0
    q_y: 5.0
    q_theta: 2.0
    r_v: 1.0
    r_omega: 0.5

# ── Pure MPC Controller ────────────────────────────────────────────────────
mpc_controller_node:
  ros__parameters:
    use_sim_time: true
    control_rate: 20.0
    trajectory_amplitude: 0.5
    trajectory_frequency: 0.15
    dt: 0.05
    v_max: 0.22
    omega_max: 2.84
    horizon: 10
    d_safe: 0.30
    q_x: 20.0
    q_y: 20.0
    q_theta: 5.0
    r_v: 1.0
    r_omega: 0.5
    du_weight_v: 0.15
    du_weight_omega: 0.6

# ── Adaptive MPC Controller ────────────────────────────────────────────────
adaptive_mpc_controller_node:
  ros__parameters:
    use_sim_time: true
    control_rate: 20.0
    trajectory_amplitude: 0.5
    trajectory_frequency: 0.15
    dt: 0.05
    v_max: 0.22
    omega_max: 2.84
    horizon: 10
    d_safe: 0.30
    q_x: 30.0
    q_y: 30.0
    q_theta: 5.0
    r_v: 0.1
    r_omega: 0.1

# ── Async (Threaded) Adaptive MPC Controller ──────────────────────────────
async_mpc_controller_node:
  ros__parameters:
    use_sim_time: true
    control_rate: 20.0
    trajectory_amplitude: 0.5
    trajectory_frequency: 0.15
    dt: 0.05
    v_max: 0.22
    omega_max: 2.84
    horizon: 10
    d_safe: 0.30
    q_x: 30.0
    q_y: 30.0
    q_theta: 5.0
    r_v: 0.1
    r_omega: 0.1

# ── Hybrid Controller ──────────────────────────────────────────────────────
# Risk-triggered adaptive MPC safety filter.
adaptive_safety_filter_node:
  ros__parameters:
    use_sim_time: true
    control_rate: 20.0
    trajectory_amplitude: 0.5
    trajectory_frequency: 0.15
    dt: 0.05
    v_max: 0.22
    omega_max: 2.84
    horizon: 10
    terminal_horizon: 5
    d_safe: 0.30
    q_x: 30.0
    q_y: 30.0
    q_theta: 5.0
    r_v: 0.1
    r_omega: 0.1
    adaptation_gamma: 0.005
    mpc_time_limit_ms: 250.0

# Existing smooth-blend hybrid controller baseline.
hybrid_controller:
  ros__parameters:
    use_sim_time: true
    control_rate: 20.0
    trajectory_amplitude: 0.5
    trajectory_frequency: 0.2
    trajectory_duration: 120.0
    dt: 0.05
    mpc_horizon: 10
    d_safe: 0.35
    v_max: 0.22
    omega_max: 2.84
    use_hybrid: true
    lookahead_dist: 0.40
    cruise_speed: 0.10
    waypoint_reach_dist: 0.08

# ── Obstacle Publisher ──────────────────────────────────────────────────────
obstacle_publisher:
  ros__parameters:
    use_sim_time: true

# ── Twist Relay (TwistStamped → Twist for Gazebo bridge) ────────────────────
twist_relay:
  ros__parameters:
    use_sim_time: true

dynamic_obstacle_publisher_node:
  ros__parameters:
    use_sim_time: true
    publish_rate: 10.0
    message_format: "quintuple"
    scenario: "crossing"
    include_static_obstacles: true
    dynamic_radius: 0.07
    crossing_x_start: -0.65
    crossing_y_start: 0.02
    crossing_x_end: 0.65
    crossing_y_end: 0.02
    crossing_speed: 0.08
    start_delay: 4.0
    sin_center_x: 0.15
    sin_center_y: 0.0
    sin_amplitude: 0.35
    sin_frequency: 0.04

command_distortion_node:
  ros__parameters:
    use_sim_time: true
    enabled: true
    input_topic: "/cmd_vel_raw"
    output_topic: "/cmd_vel"
    profile: "step"
    lambda_v: 0.85
    lambda_omega: 1.15
    lambda_v_after: 0.70
    lambda_omega_after: 1.30
    step_time: 25.0
    sin_amplitude_v: 0.10
    sin_amplitude_omega: 0.10
    sin_frequency: 0.03
    noise_std_v: 0.005
    noise_std_omega: 0.02
    min_scale: 0.40
    max_scale: 1.60
    v_max: 0.22
    omega_max: 2.84
    seed: 7
