# Local ROS 2 development services.
#
# Headless simulation:
#   docker compose up jazzy
#
# ROS 2 workspace checks:
#   docker compose --profile ci run --rm ci
#
# Bounded headless experiment, telemetry and report:
#   make docker-experiment
#
# Buildx builder selection is intentionally external to this file. Leave
# BUILDX_BUILDER unset for the normal local builder, or set it to a connected
# Docker Build Cloud builder (for example, cloud-ORG-default) before building.

x-ros-build: &ros-build
  context: .
  dockerfile: Dockerfile

services:
  jazzy:
    image: ${ROS_IMAGE_JAZZY:-risk-aware-hybrid:jazzy}
    build:
      <<: *ros-build
      args:
        ROS_DISTRO: jazzy
    environment:
      TURTLEBOT3_MODEL: burger
    network_mode: host
    stdin_open: true
    tty: true
    command: >-
      ros2 launch hybrid_nav turtlebot3_adaptive_safety_filter.launch.py
      use_rviz:=false use_gz_gui:=false

  humble:
    image: ${ROS_IMAGE_HUMBLE:-risk-aware-hybrid:humble}
    build:
      <<: *ros-build
      args:
        ROS_DISTRO: humble
    environment:
      TURTLEBOT3_MODEL: burger
    network_mode: host
    stdin_open: true
    tty: true
    profiles:
      - humble
    command: >
      ros2 launch hybrid_nav turtlebot3_hybrid.launch.py use_rviz:=false use_gz_gui:=false

  ci:
    image: ${ROS_IMAGE_JAZZY:-risk-aware-hybrid:jazzy}
    build:
      <<: *ros-build
      args:
        ROS_DISTRO: jazzy
    environment:
      TURTLEBOT3_MODEL: burger
      ROS_LOCALHOST_ONLY: "1"
      ROS_DOMAIN_ID: "42"
      PYTHONHASHSEED: "0"
      RCUTILS_COLORIZED_OUTPUT: "0"
    profiles:
      - ci
    command: ["docker-ros2-checks"]

  experiment:
    image: ${ROS_IMAGE_JAZZY:-risk-aware-hybrid:jazzy}
    build:
      <<: *ros-build
      args:
        ROS_DISTRO: jazzy
    environment:
      TURTLEBOT3_MODEL: burger
      ROS_LOCALHOST_ONLY: "1"
      ROS_DOMAIN_ID: "42"
      PYTHONHASHSEED: "0"
      RCUTILS_COLORIZED_OUTPUT: "0"
      EXPERIMENT_DURATION_SECONDS: ${EXPERIMENT_DURATION_SECONDS:-30}
      ROS_LOG_DIR: /ros2_ws/Output/ROS
      MPLBACKEND: Agg
    volumes:
      - ./Output:/ros2_ws/Output
    init: true
    stop_grace_period: 30s
    profiles:
      - experiment
    command: ["docker-headless-experiment"]
