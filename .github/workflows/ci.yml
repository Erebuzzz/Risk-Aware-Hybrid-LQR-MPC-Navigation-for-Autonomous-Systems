name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python and Rust checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -e src/hybrid_controller

      - name: Build the Rust extension
        run: .venv/bin/maturin develop --release --manifest-path crates/ra_psf_core/Cargo.toml

      - name: Run Python tests
        run: .venv/bin/python -m pytest -q

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q benchmarks src tests ros2_ws/src/hybrid_nav

      - name: Check Rust crate
        run: cargo test --manifest-path crates/ra_psf_core/Cargo.toml

  ros2:
    name: ROS 2 Jazzy container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Optional Docker Build Cloud configuration. The repository currently
      # stores both values as secrets. When they are unavailable, for example
      # on pull requests from forks, the job uses a local builder.
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      ROS_IMAGE_JAZZY: risk-aware-hybrid:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --profile '*' config --quiet

      - name: Select Docker Build Cloud or local builder
        id: builder-mode
        shell: bash
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          if [[ -n "${DOCKER_USER}" && -n "${DOCKER_PAT}" ]]; then
            echo "cloud=true" >> "${GITHUB_OUTPUT}"
          else
            echo "cloud=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to Docker Hub for Build Cloud
        if: steps.builder-mode.outputs.cloud == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx Build Cloud builder
        id: cloud-builder
        if: steps.builder-mode.outputs.cloud == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
          driver: cloud
          endpoint: ${{ secrets.DOCKER_USER }}/ros2-jazzy

      - name: Set up local Buildx fallback
        id: local-builder
        if: steps.builder-mode.outputs.cloud != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build ROS 2 Jazzy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          builder: ${{ steps.cloud-builder.outputs.name || steps.local-builder.outputs.name }}
          build-args: |
            ROS_DISTRO=jazzy
          platforms: linux/amd64
          tags: risk-aware-hybrid:ci
          load: true

      - name: Test the ROS 2 workspace
        run: docker compose --profile ci run --rm --no-deps --no-build --pull never -T ci

      - name: Run the headless Gate 1 experiment and report
        timeout-minutes: 5
        run: docker compose --profile experiment run --rm --no-deps --no-build --pull never -T experiment

      - name: Retain Gate 1 evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-ros2-jazzy
          path: Output/Gate1/
          if-no-files-found: warn
